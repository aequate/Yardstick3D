sequence_selection:
  evidence: docs/V2_SEQUENCE_ACCESS_PROBE.md
  basis: "access + dataset-table metadata ONLY; no bag byte, cue value, image or reference read"
  eligibility:
    - "MARS-LVIG *_GNSS sequence (documented u-blox receiver) not in excluded_sequences"
    - "listed in the current Drive folder with a valid confirm page"
    - "no camera/LiDAR degeneration flag in the dataset table"
    - "fits local storage with the v1 bag retained"
  rank_order:   # fixed a priori by (1) new site != v1 airfield, (2) higher cruise speed => more hover/turn speed contrast, but <= 6 m/s preferred for frame overlap, (3) smaller bag
    - HKisland_GNSS02   # 1UDcZgElsNepsJXgE9Wx1djHrLNiNwqyP, 11G, 465 s, 6 m/s, 90 m
    - HKisland_GNSS03   # 136xN27vdpUe88NugHhPKArZBveiYD3hj, 9.4G, 390 s, 9 m/s
    - HKisland_GNSS01   # 1YG22xjU6q-AECsizsrshgfgq0lUWDe7j, 20110103618 B, 772 s, 3 m/s
    - HKairport_GNSS02  # 1OVFhhpkFReSy7j1AYIYQG4rbWL_ZRP-3, 11G, same site as v1
    - HKairport_GNSS03  # 1ORuC3xyi7yonIzD8mTmKDWRU0T6snu9n, 9.1G, same site as v1
  rule: "The executing sequence is the highest-ranked eligible sequence whose full bag downloads and passes Stage-0 integrity (size match, sha256, rosbags index opens). Access failure (quota, permission, corruption) moves to the next rank and is logged in docs/PROSPECTIVE_ACCESS_LOG.md. Access retry policy: at most one retry per id after >=24 h; no resumable/ranged reassembly."
  cue_only_fallback_v5: "NOT APPLICABLE in v5 (fixed pool; see amendment_A3_pooled_sv). Historical v2-v4 text follows."
  cue_only_fallback: "If Stage-1 finds the sequence ineligible for cue-only reasons (timescale STOP with an unexplained offset, or fewer than n_test SV windows), the sequence is recorded as INELIGIBLE (reason logged, no reference read) and the next rank is used. This is allowed because the decision is GT-free and made before any backbone inference. Maximum 2 fallbacks, then the experiment STOPS."

amendment_A3_pooled_sv:              # v5
  motivation: "v4 STOPPED because every MARS-LVIG island GNSS flight is a survey profile (hover -> one acceleration -> constant cruise -> one deceleration -> hover) with at most ~2 speed-varying 16 s windows (GT-free cue census: HKisland_GNSS02 2, HKisland_GNSS03 2, HKisland_GNSS01 1). The v2-v4 rule 'n_test = 4 SV windows from ONE sequence' is unsatisfiable on this dataset family. The purpose of the SV rule (the cue must be tested where speed varies and a timing error is visible) does not require a single sequence."
  pool: "the three island sequences of dataset.pool, in the unchanged a-priori rank order. Fixed; no sequence is added, removed or substituted after this freeze."
  per_sequence_stage1: "each pool sequence runs the UNCHANGED v4 Stage-1 gates (spread rule, A2 recorder clock, cue-vs-camera 0.25 s, rtk on recorder clock, A1 time_sync) and the UNCHANGED per-window statistics/classes (census phase: no selection). A gate STOP on ANY pool sequence STOPS v5 (no fallback, no replacement)."
  pooled_selection:
    candidate_id: "(sequence, k); t0 = 16 k s elapsed from that sequence's first image (UTC)"
    non_adjacency: "within a sequence only: (seq, k) is skipped if (seq, k-1) or (seq, k+1) is already selected in ANY role"
    test: "SV windows of ALL pool sequences ranked by S descending, ties -> sequence rank, then earlier t0; the first n_test = 4 (greedy, non-adjacent) are the prospective test windows"
    validation: "next n_validation = 2 SV windows in the same ranking; if fewer remain, eligible 'other' windows ordered by (sequence rank, t0)"
    constant_cruise_controls: "up to n_cc = 2 CC windows ordered by (sequence rank, t0) (greedy, non-adjacent); SECONDARY, not in any gate"
    minimum: "fewer than 4 pooled SV test windows => v5 STOPS (claim level 0)"
  primary_endpoint_change: "median over the 4 pooled SV test windows (unchanged statistic, gates and thresholds); per-window sequence id reported"
  nominal_speed_prior: "v_cruise = the window's own sequence table speed (dataset.pool v_cruise_table_mps)"
  remote_bag_handling: "HKisland_GNSS02 is held only on the user's GPU host (local copy deleted for disk space). Its Stage 1 runs there with the same code (zip sha256 recorded). After pooled selection the host extracts that sequence's selected frames and ALSO copies the reference topics (/dji_osdk_ros/rtk_position, /dji_osdk_ros/rtk_info_position) byte-for-byte (rosbags raw rawdata + record time + connection msgdef/md5, NEVER deserialized) into a sealed sub-bag whose sha256 is recorded in the Stage-1 manifest. The sub-bag is opened ONLY at one-time Stage-2 scoring, after SCORING_RECEIPT.json, exactly like a local bag."
  disclosure: "A3 was designed after seeing the GT-free cue-only window census (SV/CC/other counts and SV S values) of the three island sequences under v3/v4. No image content, backbone output, reference value or outcome has been seen on any v2-v5 sequence. The pool (all three downloaded island sequences, rank order unchanged) and n_test = 4 leave no selection discretion: the census implies 5 non-adjacent SV candidates, and the ranking rule, not a person, picks the 4 test windows."
  no_further_amendments: "v5 is FINAL for MARS-LVIG. A v5 STOP (any gate) or a v5 FAIL is reported as-is at claim level 0; there is no v6."

camera_stream:
  topic: /left_camera/image/compressed
  message_type: sensor_msgs/CompressedImage
  rate_hz: 10
  shutter: global
  facing: downward
  primary_eye: single
  note: "Hikvision CA-050 RGB; decode via cv2; monocular only; lidar unused. Topic presence verified from bag index at Stage 0 (a topic-name mismatch is a factual amendment only if made before any value read)."

metric_cue:
  name: ublox_standalone_displacement
  topics_allowed: [/ublox_driver/receiver_lla, /ublox_driver/receiver_pvt]
  primary_topic: /ublox_driver/receiver_lla
  topics_forbidden: [/dji_osdk_ros/rtk_position, /dji_osdk_ros/rtk_velocity, /dji_osdk_ros/rtk_yaw, /dji_osdk_ros/rtk_info_position, /dji_osdk_ros/rtk_info_yaw, /dji_osdk_ros/rtk_connection_status]
  frame: WGS84-latlonalt-to-window-local-ENU
  enu_origin: "per-window first cue fix (shared origin for cue and reference within the window)"
  timestamps: "t_cue_utc = timescale.to_utc(header_stamp, class_from_stage1_gate). The raw header stamp is NEVER paired with another stream."
  preprocessing:
    - "NavSatFix lat/lon/alt -> ECEF -> local ENU about window origin (standard WGS84; no GT fit)"
    - "per-frame-interval cue length b_k = polyline sum of 10 Hz ENU fixes in (t_k, t_{k+1}] (UTC) with endpoint linear interpolation"
    - "visual chord a_k = ||P_{k+1} - P_k|| from frozen backbone prediction"
    - "constraint PathDisplacementConstraint-equivalent s*a_k ~= b_k (same semantics as v1/ADVIO/UrbanNav)"
    - "units: metres, seconds; no outcome-dependent thinning"
  quality_gate: "receiver_lla fixes used as-is; non-finite fixes dropped (never interpolated across a gap > 0.5 s); no RTK/quality filtering on the cue"
  rate_hz: 10
  variance_model: "uniform (var=1.0) primary naive/LS; Huber-robust secondary. HDOP/quality NOT used as calibration."

timestamp_synchronization:
  clock_domain: "UTC(GPS)-disciplined hardware chain per IJRR 3.3 and the dataset sync page. Header stamps may be UTC or GPST per topic; this is established per topic at Stage 1, never assumed."
  mechanism: "a-priori hardware triggers + published leap-second constant; NO fitted offset; NO cross-correlation; NO visual alignment"
  timescale_module: weakmetric3d.datasets.timescale
  gpst_minus_utc_s: 18.0            # published constant (valid since 2017-01-01); asserted equal to timescale.GPST_MINUS_UTC_S
  stage1_timescale_gate:            # NEW (B)
    topics: [/left_camera/image/compressed, /ublox_driver/receiver_lla, /dji_osdk_ros/rtk_position]
    sampling: "ALL messages of camera and cue; for rtk_position, header stamp parsed from raw serialized bytes [seq:u32, sec:u32, nsec:u32] ONLY (fields after the header are never deserialized at Stage 1)"
    statistic: "d = header_stamp - bag_record_time; per topic median, min, max, n (timescale.header_offset_stats)"
    classification: "timescale.require_common_timescale(topics, tol_s=0.5): each topic -> 'utc' (|median d| < 0.5 s) or 'gpst' (|median d - 18.0| < 0.5 s)"
    spread_rule: "per topic, (P99 - P1) of d must be < 0.5 s, i.e. no mid-bag timescale switch"
    cross_topic_rule: "after to_utc, the per-topic medians of (t_utc - record) must agree pairwise within 0.25 s"
    on_fail: "STOP. Stage 1 halts before window selection; the manifest records the stats; the sequence is INELIGIBLE (cue-only reason) per sequence_selection.cue_only_fallback. Never fitted or patched."
  amendment_A2_recorder_clock:      # v4
    motivation: "HKisland_GNSS02 and HKisland_GNSS01 stamp the DJI rtk reference (and dji time_sync) on the bag-recorder clock, which sits ~+0.41 s / ~-0.59 s from the hardware-timed camera and u-blox cue; v3 assumed the recorder clock is UTC. Measured only from sensor header/record timestamps; no reference position, window, or outcome was seen."
    delta: "delta = median(camera header - bag record time) over ALL camera messages (camera header = hardware UTC). UTC(recorder-clock topic) = its stamp + delta. A sensor-only clock measurement, never fitted to the reference or to any outcome."
    replaces: "stage1_timescale_gate classification of the camera against record time and the cross_topic_rule; all other gate rules unchanged"
    rules:
      - "every gated topic: (P99 - P1) of (header - record) < 0.5 s (unchanged spread_rule)"
      - "|delta| < 2.0 s"
      - "cue: classified utc/gpst from median(header - record - delta) within 0.5 s; after to_utc, |median(cue_utc - record - delta)| < 0.25 s (independent hardware-clock agreement with the camera; replaces cross_topic_rule)"
      - "rtk_position (and rtk_info_position): must be on the recorder clock, |median(header - record)| < 0.05 s; UTC = header + delta (header-less rtk_info_position: record + delta)"
      - "time_sync topics whose stamps are on the recorder clock (|median(stamp - record)| < 0.05 s): UTC = stamp + delta before the A1 checks (A1 thresholds unchanged)"
    fallback: "rank_order re-applied from rank 1 with a fresh count (max 2); v3 INELIGIBLE records retained for audit. HKisland_GNSS03 v3 reason (2 SV windows) is clock-independent."
    disclosure: "A2 was designed after seeing header-vs-record timing statistics of HKisland_GNSS01/02/03 and the v1 airport bag (no outcome information)."
  time_sync_decoding:               # NEW (F)
    topics: [/ublox_driver/time_pulse_info, /dji_osdk_ros/time_sync_fc_time_utc, /dji_osdk_ros/time_sync_gps_utc, /dji_osdk_ros/time_sync_nmea_msg, /dji_osdk_ros/time_sync_pps_source]
    decoder: "rosbags typestore registered from the msg definitions embedded in the bag connection records (no hand-written layouts)"
    record_per_topic: "present/absent, message type + md5sum, count, rate, header-vs-record stats and timescale class, and the decoded time fields"
    consistency_checks:
      - "A1 (v3): time_sync_gps_utc / fc_time_utc / nmea GPRMC: residual d = (UTC carried in message body) - (ROS stamp: header.stamp, or the top-level `stamp` field when the message has no header), after timescale conversion. PASS iff |median d| < 2.0 s AND (P99 - P1) of d < 0.5 s. Rationale: these fields carry integer-second UTC labels of a PPS edge (label convention unknown a priori: floor / nearest / next pulse), so |d| up to ~2 s is label quantization; a timescale error (GPST, +18 s) or clock drift is still caught."
      - "A1 disclosure: the v2 literal rule (|median| < 0.5 s) was evaluated first and STOPped with fc_time_utc median +0.563 s and gps_utc median +1.062 s (spreads < 0.02 s); both are recorded in artifacts/cross_backbone_v2/time_sync_residuals_literal.json. The 2.0 s bound was chosen after seeing these two values, which carry no backbone or reference outcome information. NMEA was not inspected before this freeze."
      - "time_pulse_info: recorded as-is (utc/gps flag if present); disclosure only"
    on_present_but_undecodable: "STOP (fail closed), as for the timescale gate"
    on_all_absent: "not a STOP; gate 1 then rests on the header/record timescale gate alone and this is disclosed"
    on_check_exceedance: "STOP; never fitted"
  matching:
    max_dt_match_camera_cue_s: 0.06
    max_dt_match_camera_ref_s: 0.15   # APPLIED at scoring (E)
    policy: "all streams in UTC after conversion; nearest-sample within tolerance; endpoint linear interpolation for cue polyline"

coordinate_transforms:
  cue_enu: "window-local ENU (E,N,U) about first cue fix; WGS84"
  reference_enu: "SAME window-local ENU origin as cue (shared origin)"
  visual_frame: "backbone camera-centers in arbitrary similarity gauge; Umeyama SE(3) primary / Sim(3) diagnostic, exactly as v1"
  extrinsics_note: "CAD antenna-camera lever arm (~dm) << 16 s window path; absorbed in oracle floor and disclosed"

frame_sampling:
  window_duration_s: 16
  frames_per_window: 8
  frame_selection: "uniform linspace over [t_start, t_start+16] (UTC) snapped to nearest image timestamp within 0.06 s"
  start_reference: "elapsed seconds from FIRST image timestamp (UTC) in bag"
  window_starts: "DETERMINED by window_selection (cue-only) at Stage 1; written to stage1_manifest.json with the cue statistics BEFORE any backbone inference or reference read"

window_selection:                   # NEW (C, D) — GT-free, cue-only, deterministic
  inputs: "camera timestamps + UTC-converted receiver_lla fixes ONLY (no reference, no image content, no backbone output)"
  candidate_grid: "t0 = 16*k s elapsed, k = 1,2,...; keep t0 with t0 + 16 + 2 <= last image elapsed (non-overlapping tiling; 1 s speed-stencil margin each side)"
  speed_profile:
    positions: "sequence-level ENU (E,N) about the first valid cue fix; linear interpolation onto a 0.1 s UTC grid; grid points inside a cue gap > 0.5 s are NaN"
    horizontal_speed: "v_h(t) = ||p_EN(t+1.0) - p_EN(t-1.0)|| / 2.0 s (centered 2 s difference)"
  per_window_statistics:
    valid_frac: "fraction of non-NaN v_h grid points in [t0, t0+16]"
    v_mean: "mean v_h"
    cv: "std(v_h, ddof=0) / mean(v_h)"
    dv: "P95(v_h) - P5(v_h)"
    S: "timing sensitivity = max over tau in {-18, +18} s of |L(tau)/L(0) - 1|, where L(tau) = 3D cue polyline length over [t0+tau, t0+16+tau] (UTC); a tau whose window leaves the cue span is skipped; at least one tau required"
  eligibility:
    - "all 8 frames matched within 0.06 s"
    - "cue coverage >= 0.8 of the 7 intervals (as v1)"
    - "valid_frac >= 0.8"
    - "v_mean >= 1.5 m/s (excludes hover and pure vertical takeoff/landing)"
  classes:
    SV_speed_varying: "cv >= 0.20 AND dv >= 1.5 m/s AND S >= 0.10"
    CC_constant_cruise: "cv < 0.10 AND S < 0.05"
    other: "eligible but neither SV nor CC (not selected)"
  thresholds_rationale: "cv 0.20 / dv 1.5 m/s are well above what standalone-GNSS noise does to a 2 s-differenced speed at steady cruise (~0.1-0.3 m/s); S >= 0.10 means an 18 s timescale error would move the naive scale by >= 10%, so a v1-type defect would be visible in gates 1/6/7. Fixed now; never tuned on data."
  selection:
    ranking: "SV windows sorted by S descending; ties -> earlier t0"
    non_adjacency: "greedy: a window is skipped if a grid neighbour (t0 +/- 16) is already selected in ANY role"
    test: "first n_test = 4 SV windows in ranking order (greedy, non-adjacent)"
    validation: "next n_validation = 2 SV windows in ranking order (greedy, non-adjacent); if fewer remain, fill with eligible 'other' windows, earliest t0 first"
    constant_cruise_controls: "up to n_cc = 2 CC windows, earliest t0 first (greedy, non-adjacent). SECONDARY only; not in any gate."
    minimum: "v5: superseded by amendment_A3_pooled_sv.pooled_selection (pooled; no fallback)"
  n_test: 4
  n_validation: 2
  n_cc: 2
  role_of_validation: "adapter/pipeline/GT-free sync diagnostics before scoring; the reference stays withheld until the same one-time scoring; reported in a validation table, NOT a claim"
  gt_free_pre_scoring_diagnostic: "for every selected window after inference: Spearman rho(a_k, b_k) between per-interval visual chords and cue lengths, and the same with the cue shifted +/-18 s. Recorded before scoring; disclosure only (see open_decisions)."

backbones:
  da3-base:
    family: depth-anything-3
    hub: depth-anything/DA3-BASE
    from_pretrained_required: true
    is_metric: false
    process_res: 378
    process_res_method: upper_bound_resize
    ref_view_strategy: middle
    device: cuda
    execution: local
  vggt-1b:
    family: vggt
    model_id: facebook/VGGT-1B
    model_revision: 860abec7937da0a4c03c41d3c269c366e82abdf9
    source_url: https://github.com/facebookresearch/vggt.git
    source_revision: a288dd0f14786c93483e45524328726ab7b1b4ce
    checkpoint: model.pt
    checkpoint_bytes: 5026874952
    checkpoint_sha256: d15bf50a8615c8225ed48b51ea5cac673d82442ec0309036df555a053253afe0
    preprocess: "official load_and_preprocess_images(mode=crop), width 518"
    compute_dtype: "float32 weights; bfloat16 autocast on CUDA major>=8 else float16"
    seed: 0
    license: CC-BY-NC-4.0
    execution: off_box_user_gpu
  only_intended_variable: "backbone prediction (same windows, frames, cue, preprocessing, solver, evaluator, sync mapping)"

solver:
  implementation: weakmetric3d.optimization.grounder.MetricGrounder
  solvers_scored: [none, naive, ls, robust]
  primary_solver: naive
  robust_loss: {kernel: huber, huber_delta: 1.345, max_iters: 25, reject_z: 6.0, min_obs: 1}
  code_frozen: true

reference_handling:                 # NEW (E) — applied, not merely declared
  topic: /dji_osdk_ros/rtk_position
  fix_status_topic: /dji_osdk_ros/rtk_info_position
  fixed_values: [50]   # NARROW_INT (RTK fixed). DJI OSDK positionSolution: 0 none, 16 single, 34 float, 50 fixed. Source: DJI OSDK Telemetry::RTK reference + DJI Enterprise geospatial FAQ (resolved from documentation 2026-09-29, before any data)
  when_read: "ONLY at one-time Stage-2 scoring, after SCORING_RECEIPT.json is written atomically (as v1)"
  per_frame_match: "reference position = nearest rtk_position sample (UTC per Stage-1 class) within 0.15 s of the frame's UTC stamp; fix status = nearest rtk_info_position sample within 0.15 s; frame is REF-VALID iff both matched AND status in fixed_values"
  window_rule: "window evaluable iff >= 7 of 8 frames are REF-VALID; ATE computed on REF-VALID frames only (identical frame subset for both backbones and all solvers); otherwise excluded before any metric is computed, disclosed, NOT replaced"
  log: "per window: n matched, n fixed, max |dt|; written before metrics in the scoring log"

valid_missing_sensor_handling:
  cue_coverage_required: 0.8
  ref_valid_frames_required: 7      # of 8 (see reference_handling)
  missing_cue_action: "drop interval; window valid iff >=80% of 7 intervals covered"
  missing_ref_action: "window excluded at scoring before metrics (recorded, NOT replaced)"
  nan_scale_action: "report NaN, count as failure, no substitution"

evaluation_metrics:
  - raw_ate_se3
  - grounded_ate_se3_naive_primary
  - grounded_ate_se3_ls
  - grounded_ate_se3_robust
  - oracle_ate_optimal
  - oracle_scale_ate_optimal
  - raw_ate_sim3_diagnostic_only
  - estimated_scale_s_hat
  - cue_supported_scale_s_cue
  - cue_reference_discrepancy_Lg_over_Lt
  - three_limits_factors
  - estimator_departure_s_hat_over_s_cue
  - scale_error_log_and_rel
  - nominal_speed_prior_ate_se3     # NEW (H), secondary
evaluation_alignment: "Umeyama SE(3) primary; Sim(3) diagnostic only"   # v1 nested this under the metrics list (not valid YAML); moved to its own key

primary_endpoint: "Per backbone, median naive-grounded SE(3) ATE vs median raw SE(3) ATE over the 4 frozen POOLED SV test windows (A3) (withheld reference, one-time scoring), always co-reported with median oracle ATE (absolute) and leverage. Success = substantial raw->grounded reduction when the oracle admits correction, with grounded approaching each backbone's own global-scale oracle. No ranking between backbones."
secondary_endpoints:
  - "per-window raw/grounded/oracle/scales + three-limits identity for each backbone"
  - "robust vs naive comparison"
  - "cue/reference discrepancy Lg/Lt distribution, per class (SV vs CC)"
  - "nominal-speed-prior baseline: s_prior = v_cruise_table * 16 s / sum_k a_k (dataset-table cruise speed; no sensor) — grounded vs prior ATE per SV window"
  - "constant-cruise control windows (CC): same metrics, not in gates"
  - "timing-sensitivity S per window and GT-free rho(a,b) diagnostics"
