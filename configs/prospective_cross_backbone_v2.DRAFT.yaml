# ============================================================================
# DRAFT — NOT FROZEN.  Prospective cross-backbone contract v2 (MARS-LVIG).
# This file has NO sha256 in artifacts/experiment_registry.json and has no
# evidential force. Freezing procedure (in order):
#   1. Choose the sequence by the selection rule below (access only; no bag bytes read).
#   2. Resolve every item under `open_decisions`, then delete that block.
#   3. Rename to configs/prospective_cross_backbone_v2.yaml, set status: frozen_pre_data,
#      record its sha256 in artifacts/experiment_registry.json.
#   4. Only THEN download the bag and read anything beyond the bag index/connection
#      headers (topic list, msg types, counts). Cue values, image payloads,
#      time_sync values and reference values are all post-freeze.
# Modeled on configs/prospective_cross_backbone_v1.yaml (sha d78159e6…6330).
# v1 failed Claim 1 (docs/CLAIM_LEVEL_1_CROSS_BACKBONE_ADJUDICATION.md): the u-blox
# header stamps were GPST (+18 s) and were not converted, and the constant-speed test windows could
# not detect this. Every change from v1 is listed under `changes_from_v1`.
# ============================================================================

name: prospective_cross_backbone_v2
status: DRAFT_NOT_FROZEN
supersedes: prospective_cross_backbone_v1
supersede_reason: "v1 Claim 1 FAIL (gate 1: cue in GPST, unconverted; gate 12: NO). v2 is a NEW pre-registered experiment on a NEW, never-downloaded sequence; it is not a replay of HKairport_GNSS01."
changes_from_v1:
  - "A: cue (and any other GPST topic) converted GPST->UTC with the published constant via weakmetric3d.datasets.timescale (GPST_MINUS_UTC_S = 18.0); never fitted"
  - "B: new Stage-1 timescale gate (per-topic header-vs-record classification, require_common_timescale; STOP otherwise)"
  - "C: GT-free, cue-only, speed-variation window selection with a +/-18 s timing-sensitivity requirement (replaces fixed elapsed starts)"
  - "D: explicit validation/test split rule; optional constant-cruise controls (secondary)"
  - "E: RTK-fixed gating and 0.15 s camera-reference match APPLIED at scoring (were declared but not applied in v1)"
  - "F: time_sync / time_pulse topics DECODED at Stage 1 (never decoded in v1); fail closed"
  - "G: sequence selected by a stated access-only rule (placeholder until the access probe resolves)"
  - "H: nominal-speed-prior baseline added as a secondary endpoint (tests whether the cue carries more than 'cruise speed x duration')"

