name: prospective_cross_backbone_v5
status: frozen_pre_data
supersedes: prospective_cross_backbone_v4   # v4 + amendment A3 only (v4 = v3 + A2, v3 = v2 + A1)
supersede_reason: "v1 Claim 1 FAIL (gate 1: cue in GPST, unconverted; gate 12: NO). v2 is a NEW pre-registered experiment on a NEW, never-downloaded sequence; it is not a replay of HKairport_GNSS01."
changes_from_v1:
  - "A: cue (and any other GPST topic) converted GPST->UTC with the published constant via weakmetric3d.datasets.timescale (GPST_MINUS_UTC_S = 18.0); never fitted"
  - "B: new Stage-1 timescale gate (per-topic header-vs-record classification, require_common_timescale; STOP otherwise)"
  - "C: GT-free, cue-only, speed-variation window selection with a +/-18 s timing-sensitivity requirement (replaces fixed elapsed starts)"
  - "D: explicit validation/test split rule; optional constant-cruise controls (secondary)"
  - "E: RTK-fixed gating and 0.15 s camera-reference match APPLIED at scoring (were declared but not applied in v1)"
  - "F: time_sync / time_pulse topics DECODED at Stage 1 (never decoded in v1); fail closed"
  - "G: sequence selected by a stated access-only rule (placeholder until the access probe resolves)"
  - "H: nominal-speed-prior baseline added as a secondary endpoint (tests whether the cue carries more than 'cruise speed x duration')"

