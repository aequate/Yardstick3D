# v5 = v4 (sha d484ebb2...a27670) + ONE amendment (A3: pooled SV test windows across a FIXED pool
# of the three island sequences), per contract_immutability ('Bug => new version + reason').
# Frozen after v4 stopped on the GT-free window-count rule and BEFORE any window selection,
